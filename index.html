<style>
/* Layout: header, toolbar, then a two-column split: list on the left, live map on the right (map first on phones). */
:root {
  --bg: #F3F5F4; --surface: #FFFFFF; --surface-2: #E9EEEC; --fg: #1A1F1D; --muted: #5A6561; --line: #D9DFDC;
  --accent: #C23B25; --accent-ink: #FFFFFF; --yolk: #F4BA1C; --yolk-ink: #3A2B00; --good: #2C7A4B; --danger: #B3261E; --me: #2563EB;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111514; --surface: #1A1F1E; --surface-2: #232A28; --fg: #ECEFED; --muted: #9AA49F; --line: #2B3331;
    --accent: #F0705A; --accent-ink: #1C0A06; --yolk: #F6C93E; --yolk-ink: #2A1E00; --good: #5FC088; --danger: #F08A82; --me: #6EA0FF;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.1; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--yolk); outline-offset: 2px; }
.wrap { max-width: 1240px; margin-inline: auto; padding-inline: 16px; }
[hidden] { display: none !important; }

header.top { border-bottom: 1px solid var(--line); }
.brand-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-block: 14px 10px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.01em; }
.brand small { display: block; color: var(--muted); font-size: 0.78rem; }
.head-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); padding: 3px; }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 6px 12px; font-weight: 600; font-size: 0.85rem; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

nav.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs button { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 16px; font-weight: 600; cursor: pointer; }
nav.tabs button[aria-selected="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

.toolbar { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1fr auto; gap: 10px; align-items: end; padding-block: 14px 0; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label, .lbl { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
input, select, textarea { width: 100%; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; }
input[type="checkbox"] { width: 18px; height: 18px; padding: 0; accent-color: var(--accent); }
textarea { min-height: 76px; resize: vertical; }
.check { display: flex; align-items: center; gap: 8px; padding-block: 9px; font-weight: 500; white-space: nowrap; }
.tool-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-block: 12px 0; }

.layout { display: grid; grid-template-columns: minmax(0, 480px) minmax(0, 1fr); gap: 16px; align-items: start; padding-block: 16px 56px; }
#list { display: grid; gap: 14px; min-width: 0; }
#map { position: sticky; top: 12px; z-index: 0; height: min(78vh, 760px); min-height: 420px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface-2); }
.maphint { color: var(--muted); font-size: 0.8rem; margin: 8px 0 0; }

.intro h2 { font-size: clamp(1.4rem, 3vw, 1.9rem); font-weight: 800; letter-spacing: -0.02em; }
.intro p { margin: 6px 0 0; color: var(--muted); }
.cta { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; background: var(--surface); border: 1px solid var(--line); border-left: 6px solid var(--yolk); border-radius: 12px; padding: 12px 16px; }
.cta p { margin: 0; flex: 1 1 220px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.card h3 { font-size: 1.25rem; font-weight: 700; }
.kicker { font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.price { background: var(--yolk); color: var(--yolk-ink); border-radius: 8px; padding: 4px 10px; text-align: right; font-family: var(--font-data); font-weight: 500; flex: none; }
.price b { display: block; font-size: 1.05rem; white-space: nowrap; }
.price span { font-size: 0.7rem; display: block; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); font-size: 0.9rem; }
.facts strong { color: var(--fg); font-weight: 600; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { font-size: 0.75rem; font-weight: 600; border-radius: 999px; padding: 2px 10px; border: 1px solid var(--line); background: var(--surface-2); }
.pill.good { color: var(--good); border-color: var(--good); background: transparent; }
.notes { margin: 0; font-size: 0.92rem; }
.tag { display: inline-block; font-size: 0.7rem; font-weight: 600; border: 1px dashed var(--muted); color: var(--muted); border-radius: 6px; padding: 1px 6px; margin-left: 6px; vertical-align: middle; }
.tag.mine { border-style: solid; border-color: var(--accent); color: var(--accent); }
.sold { opacity: 0.6; }
.sold .price { background: var(--surface-2); color: var(--muted); }

.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); border-radius: 10px; padding: 9px 14px; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.warn { background: transparent; color: var(--danger); border-color: var(--danger); }
.btn.sm { padding: 6px 10px; font-size: 0.85rem; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.contact { display: grid; gap: 8px; background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.contact .num { font-family: var(--font-data); font-size: 1.05rem; overflow-wrap: anywhere; }
.empty { border: 1px dashed var(--line); border-radius: 14px; padding: 28px 16px; text-align: center; color: var(--muted); }
.note, .hint { color: var(--muted); font-size: 0.85rem; margin: 0; }
.err { color: var(--danger); font-size: 0.85rem; min-height: 1.2em; margin: 0; }

.tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
table { border-collapse: collapse; width: 100%; min-width: 480px; }
th, td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
tr:last-child td { border-bottom: 0; }
td.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; white-space: nowrap; }
.range { position: relative; height: 10px; background: var(--surface-2); border-radius: 999px; min-width: 110px; }
.range i { position: absolute; top: 0; bottom: 0; background: var(--accent); border-radius: 999px; opacity: 0.85; }
.range b { position: absolute; top: -3px; width: 4px; height: 16px; background: var(--yolk); border-radius: 2px; }

.formcard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 14px; }
.formcard .formgrid { margin-bottom: 0; }
.formcard h3 { font-size: 1.15rem; font-weight: 700; }
#list select[data-contact-status] { width: 100%; }
/* map markers */
.mk { width: 18px; height: 18px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 1px 5px rgba(0, 0, 0, 0.5); }
.mk.farm { background: #C23B25; }
.mk.order { background: #F4BA1C; }
.mk.approx { border-style: dashed; }
.mk.pinprev { width: 22px; height: 22px; background: #2563EB; border-color: #fff; }
.pop { font-family: var(--font-body); line-height: 1.45; }
.pop a { color: #C23B25; }

dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--fg); padding: 18px; width: min(720px, calc(100% - 24px)); max-height: 92vh; overflow: auto; }
dialog::backdrop { background: rgba(0, 0, 0, 0.55); }
dialog h2 { font-size: 1.5rem; margin-bottom: 12px; }
.formgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 12px; }
.formgrid .full { grid-column: 1 / -1; }

.pickbar { display: none; position: fixed; left: 50%; transform: translateX(-50%); top: 12px; z-index: 2000; background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 12px; gap: 12px; align-items: center; max-width: calc(100% - 24px); }
body.picking .pickbar { display: flex; }
body.picking #map { cursor: crosshair; }
#toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; z-index: 3000; max-width: calc(100% - 32px); }

@media (max-width: 900px) {
  .toolbar { grid-template-columns: 1fr 1fr; }
  .toolbar .field:first-child { grid-column: 1 / -1; }
  .layout { grid-template-columns: minmax(0, 1fr); }
  #map { position: relative; top: 0; height: 46vh; min-height: 300px; order: -1; }
}
@media (max-width: 640px) { .formgrid { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; transition: none !important; } }
</style>
</head>

<header class="top">
  <div class="wrap">

        <div><h1>Poultry Connect</h1><small id="stats"></small></div>

      </div>
    <nav class="tabs" aria-label="Sections">
      <button type="button" data-tab="farms" aria-selected="true">Farms</button>
      <button type="button" data-tab="orders" aria-selected="false">Buyer requests</button>
      <button type="button" data-tab="buy" aria-selected="false">I want to buy</button>
      <button type="button" data-tab="sell" aria-selected="false">I want to sell</button>
      <button type="button" data-tab="buyers" aria-selected="false">Find buyers</button>

      <button type="button" data-tab="mine" aria-selected="false">My posts</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="toolbar" id="toolbar" aria-label="Filters">
    <div class="field"><label for="q">Search</label><input id="q" type="search" placeholder="Farm, product or district"></div>
    <div class="field"><label for="fprod">Product</label><select id="fprod"></select></div>
    <div class="field"><label for="fdist">District</label><select id="fdist"></select></div>
    <div class="field"><label for="fsort">Sort</label><select id="fsort"><option value="new">Newest first</option><option value="near" disabled>Nearest to me</option></select></div>
    <div class="field"><label for="frad">Distance</label><select id="frad" disabled><option value="0">Any distance</option><option value="10">Within 10 km</option><option value="25">Within 25 km</option><option value="50">Within 50 km</option><option value="100">Within 100 km</option></select></div>
    <label class="check"><input id="fdel" type="checkbox"> Delivers only</label>
  </section>
  <div class="tool-row" id="toolrow">
    <button class="btn" type="button" data-act="locate">Use my location</button>
    <button class="btn ghost" type="button" data-act="fit-uganda">Show all Uganda</button>
    <span class="hint" id="locstate">Share your location to see the nearest farms and how far away they are.</span>
  </div>

  <div class="layout">
    <section id="list" aria-live="polite"></section>
    <div>
      <div id="map" role="region" aria-label="Map of farms and restaurants"></div>
      <p class="maphint">Red markers are farms and yellow markers are restaurants. A dashed outline means the position is approximate (the district centre). Distances are straight-line estimates.</p>
    </div>
  </div>
</main>

<div class="pickbar" role="status"><span>Tap the map to place your pin</span><button class="btn sm" type="button" data-act="pick-cancel">Cancel</button></div>
<div id="toast" role="status" hidden></div>

    var rest = fld(P + '-paste', 'Or paste coordinates or a Google Maps link (optional)', '<input id="' + P + '-paste" placeholder="0.3476, 32.5825">', true) +
      fld(P + '-notes', 'More details (optional)', '<textarea id="' + P + '-notes" placeholder="' + (buy ? 'Size or grade, delivery time, payment terms' : 'Breed, weight, vaccination, packaging, delivery area') + '"></textarea>', true);
    return head + '<form class="formcard postform" data-kind="' + kind + '" novalidate><div class="formgrid">' + fields + pin + rest + '</div>' +
      '<p class="err" id="' + P + '-err" role="alert"></p><div class="row"><button class="btn" type="submit">' + (buy ? 'Send my request' : 'Post my flock') + '</button></div></form>';
  }
  function updatePinText() {
    var el = $('#pinstate'); if (!el) return;
    el.textContent = ui.pin ? 'Pin set at ' + ui.pin.lat.toFixed(5) + ', ' + ui.pin.lng.toFixed(5) + '. Your exact spot will show on the map.'
      : 'No pin yet. Without one, your post appears near the centre of the district you choose.';
  }
  function setPin(p) {
    ui.pin = p;
    if (map) {
      if (pinMarker) { map.removeLayer(pinMarker); pinMarker = null; }
      if (p) pinMarker = L.marker([p.lat, p.lng], { icon: L.divIcon({ className: 'mk pinprev', iconSize: [22, 22], iconAnchor: [11, 11] }), interactive: false }).addTo(map);
    }
    updatePinText();
    var dsel = document.querySelector('#b-district, #s-district');
    if (p && dsel) dsel.value = nearestDistrict(p);
  }
  function pickOnMap() {
    if (!map) { toast('The map is not available.'); return; }
    endPick();
    ui.picking = true;
    document.body.classList.add('picking');
    $('#map').scrollIntoView({ block: 'center' });
    pickHandler = function (e) {
      endPick();
      setPin({ lat: round5(e.latlng.lat), lng: round5(e.latlng.lng) });
      toast('Pin placed on the map');
      var el = $('#pinstate'); if (el) el.scrollIntoView({ block: 'center' });
    };
    map.once('click', pickHandler);
  }
  function endPick() { ui.picking = false; document.body.classList.remove('picking'); if (pickHandler) { map.off('click', pickHandler); pickHandler = null; } }
  function enableNear() { $('#fsort').querySelector('[value="near"]').disabled = false; $('#fsort').value = 'near'; $('#frad').disabled = false; }

  function submitPost(kind) {
    var buy = kind === 'buy', P = buy ? 'b' : 's';
    var v = function (id) { return ($('#' + P + '-' + id).value || '').trim(); }, err = $('#' + P + '-err');
    function fail(m) { err.textContent = m; }
    if (!v('name')) return fail(buy ? 'Enter your name or business.' : 'Enter your farm name.');
    if (!buy && !v('owner')) return fail('Enter your name.');
    if (v('name').length > 80 || v('notes').length > 500) return fail('Keep the name under 80 characters and the details under 500.');
    if (!(Number(v('qty')) > 0) || !(Number(v('price')) > 0)) return fail('Enter a quantity and a price greater than zero.');
    if (!validPhone(v('phone'))) return fail('Enter a phone number ' + (buy ? 'farms' : 'buyers') + ' can reach, for example 0772 000 000.');
    if (buy && v('date') && v('date') < todayStr()) return fail('Choose today or a later date.');
    var pasted = checkGps(v('paste'));
    if (pasted === false) return fail(GPS_ERR);
    var pin = pasted || ui.pin, id = uid(), d = pin ? nearestDistrict(pin) : v('district'), c = PLACES[d];
    var it = {
      id: id, name: v('name'), product: v('product'), qty: Number(v('qty')), unit: v('unit'), price: Number(v('price')), district: d,
      phone: v('phone'), notes: v('notes'), ts: Date.now(), exact: !!pin,
      lat: pin ? pin.lat : c[0] + jit(id, 0), lng: pin ? pin.lng : c[1] + jit(id, 1)
    };
    if (buy) { it.owner = it.name; it.buyerType = v('type'); it.freq = v('freq'); it.needBy = v('date'); it.recv = v('recv'); }
    else { it.owner = v('owner'); it.avail = v('avail'); it.delivers = $('#s-deliv').checked; }
    if (!savePost(buy ? 'orders' : 'farms', it)) return;
    endPick(); setPin(null);
    ui.q = ''; ui.district = ''; ui.delivers = false; ui.radius = 0; ui.product = it.product;
    if (pin) { ui.me = { lat: pin.lat, lng: pin.lng, acc: 0 }; ui.sort = 'near'; enableNear(); drawMe(); $('#locstate').textContent = 'Using your pin to sort by distance.'; }
    ui.tab = buy ? 'farms' : 'orders';
    syncFilters(); render(true);
    toast(buy ? 'Request sent. Showing farms that sell ' + it.product + '.' : 'Flock posted. Showing buyers who want ' + it.product + '.');
    window.scrollTo(0, 0);
  }

  /* ---------- find buyers: map searches, WhatsApp invites, private contacts ---------- */
  var CONTACT_KEY = 'poultryconnect.contacts.v1';
  var BUSINESS_TYPES = [['Restaurants', 'restaurants'], ['Hotels and lodges', 'hotels'], ['Caterers', 'catering'], ['Cafes', 'cafe'], ['Supermarkets', 'supermarket'], ['Butcheries', 'butchery']];
  var CONTACT_TYPES = ['Restaurant', 'Hotel or lodge', 'Caterer', 'Cafe', 'Supermarket', 'Butchery', 'Other'];
  var STATUSES = ['To call', 'Contacted', 'Interested', 'Not interested'];
  var contacts = [];
  try { contacts = JSON.parse(localStorage.getItem(CONTACT_KEY)) || []; } catch (e) { contacts = []; }
  function saveContacts() { try { localStorage.setItem(CONTACT_KEY, JSON.stringify(contacts)); } catch (e) {} }
  function toIntl(num) {
    var d = String(num).replace(/[^\d+]/g, '');
    if (d.charAt(0) === '+') return d.slice(1);
    if (d.indexOf('00') === 0) return d.slice(2);
    if (d.charAt(0) === '0') return '256' + d.slice(1);
    return d;
  }
  function mapSearchHref(term, district) {
    if (district === '__me' && ui.me) return 'https://www.google.com/maps/search/' + encodeURIComponent(term) + '/@' + ui.me.lat + ',' + ui.me.lng + ',13z';
    return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(term + ' in ' + (district === '__me' ? 'Uganda' : district) + ', Uganda');
  }
  function inviteMessage() {
    var g = function (id) { var el = $('#' + id); return el ? el.value.trim() : ''; };
    var who = g('i-name') || 'a poultry farmer', prod = g('i-product') || 'Eggs';
    var price = Number(g('i-price')) > 0 ? ' at UGX ' + ugx(g('i-price')) + ' per ' + unitFor(prod) : '';
    var where = g('i-district') ? ' in ' + g('i-district') : '';
    var site = location.href.split('#')[0].split('?')[0];
    return 'Hello, my name is ' + who + '. I have ' + prod.toLowerCase() + ' for sale' + where + price + '. If you need a supplier, you can see farms and post what you need on Poultry Connect: ' + site +
      (g('i-phone') ? ' You can call or WhatsApp me on ' + g('i-phone') + '.' : '') + ' Thank you.';
  }
  function buyersHtml() {
    var names = PRODUCTS.map(function (p) { return p.name; });
    var chips = BUSINESS_TYPES.map(function (t) {
      return '<a class="btn sm ghost" data-act="mapsearch" data-term="' + esc(t[1]) + '" href="' + mapSearchHref(t[1], 'Kampala') + '" target="_blank" rel="noopener noreferrer">' + esc(t[0]) + '</a>';
    }).join('');
    return '<div class="intro"><h2>Find buyers</h2><p>Look up businesses that may want your poultry, invite people you know, and keep your own list of leads. Nothing here is shared with anyone.</p></div>' +
      '<section class="formcard"><h3>Find businesses on the map</h3>' +
      fld('fb-district', 'Where', '<select id="fb-district">' + opts(DISTRICTS, 'Kampala') + '<option value="__me">Near my location</option></select>') +
      '<div class="row">' + chips + '</div><p class="hint">Opens Google Maps in a new tab. Pick businesses that list a phone number, then save them under My contacts below. For Near my location, tap Use my location first.</p></section>' +
      '<section class="formcard"><h3>Invite a buyer on WhatsApp</h3><p class="hint">Write a message about what you sell. Send it to a restaurant or shop you know. Leave the number empty to choose a contact inside WhatsApp.</p><div class="formgrid">' +
      fld('i-name', 'Your name or farm', '<input id="i-name" autocomplete="name">') +
      fld('i-phone', 'Your phone', '<input id="i-phone" type="tel" autocomplete="tel" placeholder="0772 000 000">') +
      fld('i-product', 'What you sell', '<select id="i-product">' + opts(names) + '</select>') +
      fld('i-price', 'Price per unit (UGX, optional)', '<input id="i-price" type="number" min="1" inputmode="numeric">') +
      fld('i-district', 'Your district', '<select id="i-district">' + opts(DISTRICTS, 'Kampala') + '</select>') +
      fld('i-to', 'Buyer WhatsApp number (optional)', '<input id="i-to" type="tel" placeholder="0772 000 000">') +
      fld('i-msg', 'Message', '<textarea id="i-msg"></textarea>', true) +
      '</div><div class="row"><a class="btn" id="i-wa" data-act="invite-wa" href="#" target="_blank" rel="noopener noreferrer">Open WhatsApp</a><button class="btn ghost" type="button" data-act="invite-copy">Copy message</button></div></section>' +
      '<section class="formcard"><h3>My contacts</h3><p class="hint">Saved only on this phone. Save businesses you found with a public business phone number, or people who agreed to hear from you. Contact them politely and stop if they say no.</p><div class="formgrid">' +
      fld('c-name', 'Business or person', '<input id="c-name">') +
      fld('c-type', 'Type', '<select id="c-type">' + opts(CONTACT_TYPES) + '</select>') +
      fld('c-phone', 'Phone (optional)', '<input id="c-phone" type="tel" placeholder="0772 000 000">') +
      fld('c-district', 'District', '<select id="c-district">' + opts(DISTRICTS, 'Kampala') + '</select>') +
      fld('c-note', 'Note (optional)', '<textarea id="c-note" placeholder="Who you spoke to, what they buy, when to call again"></textarea>', true) +
      '</div><p class="err" id="c-err" role="alert"></p><div class="row"><button class="btn" type="button" data-act="contact-add">Save contact</button></div>' +
      '<div id="contactsList"></div></section>';
  }
  function renderContacts() {
    var el = $('#contactsList'); if (!el) return;
    if (!contacts.length) { el.innerHTML = '<div class="empty">No contacts yet. Save a business you found on the map to keep track of who you called.</div>'; return; }
    el.innerHTML = contacts.map(function (c) {
      var plain = (c.phone || '').replace(/[^\d+]/g, '');
      return '<article class="card"><div class="card-head"><div><div class="kicker">' + esc(c.type) + (c.district ? ' · ' + esc(c.district) : '') + '</div><h3>' + esc(c.name) + '</h3></div></div>' +
        (c.phone ? '<div class="facts"><strong>' + esc(c.phone) + '</strong></div>' : '') +
        (c.note ? '<p class="notes">' + esc(c.note) + '</p>' : '') +
        '<select aria-label="Status for ' + esc(c.name) + '" data-contact-status="' + c.id + '">' + opts(STATUSES, c.status) + '</select>' +
        '<div class="row">' + (c.phone ? '<a class="btn sm" href="tel:' + esc(plain) + '">Call</a><a class="btn sm ghost" data-act="contact-wa" data-id="' + c.id + '" href="#" target="_blank" rel="noopener noreferrer">WhatsApp</a>' : '') +
        '<button class="btn sm warn" type="button" data-act="contact-remove" data-id="' + c.id + '">Remove</button></div></article>';
    }).join('');
  }
  function initBuyers() { renderContacts(); var m = $('#i-msg'); if (m) m.value = inviteMessage(); }

  document.addEventListener('input', function (e) {
    var id = e.target.id || '';
    if (id === 'i-msg') e.target.dataset.edited = '1';
    else if (id.indexOf('i-') === 0) { var m = $('#i-msg'); if (m && m.dataset.edited !== '1') m.value = inviteMessage(); }
  });
  document.addEventListener('change', function (e) {
    var id = e.target.id || '';
    if (id.indexOf('i-') === 0 && id !== 'i-msg') { var m = $('#i-msg'); if (m && m.dataset.edited !== '1') m.value = inviteMessage(); }
    var cid = e.target.dataset && e.target.dataset.contactStatus;
    if (cid) {
      var c = contacts.filter(function (x) { return x.id === cid; })[0];
      if (c) { c.status = e.target.value; saveContacts(); toast('Status updated'); }
    }
  });
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    var act = b.dataset.act;
    if (act === 'mapsearch') {
      var where = $('#fb-district').value;
      if (where === '__me' && !ui.me) { e.preventDefault(); toast('Tap Use my location first, then try again.'); return; }
      b.href = mapSearchHref(b.dataset.term, where);
    } else if (act === 'invite-wa') {
      var to = ($('#i-to').value || '').trim();
      b.href = 'https://wa.me/' + (to ? toIntl(to) : '') + '?text=' + encodeURIComponent($('#i-msg').value);
    } else if (act === 'invite-copy') {
      try { navigator.clipboard.writeText($('#i-msg').value).then(function () { toast('Message copied'); }, function () { toast('Press and hold the message to copy it'); }); }
      catch (err) { toast('Press and hold the message to copy it'); }
    } else if (act === 'contact-wa') {
      var c = contacts.filter(function (x) { return x.id === b.dataset.id; })[0];
      if (c) b.href = 'https://wa.me/' + toIntl(c.phone) + '?text=' + encodeURIComponent(inviteMessage());
    } else if (act === 'contact-add') {
      var v = function (k) { return ($('#c-' + k).value || '').trim(); }, er = $('#c-err');
      if (!v('name')) { er.textContent = 'Enter the business or person name.'; return; }
      if (v('phone') && !validPhone(v('phone'))) { er.textContent = 'Enter a valid phone number, for example 0772 000 000.'; return; }
      er.textContent = '';
      contacts.unshift({ id: uid(), name: v('name'), type: v('type'), phone: v('phone'), district: v('district'), note: v('note'), status: 'To call', ts: Date.now() });
      saveContacts(); renderContacts();
      ['name', 'phone', 'note'].forEach(function (k) { $('#c-' + k).value = ''; });
      toast('Contact saved on this phone');
    } else if (act === 'contact-remove') {
      contacts = contacts.filter(function (x) { return x.id !== b.dataset.id; });
      saveContacts(); renderContacts(); toast('Contact removed');
    }
  });

  /* ---------- saving posts: on this phone, or in the shared database once it is set up ---------- */
  function isMine(it) { return cloud.on ? it.ownerId === cloud.uid : state.mine.indexOf(it.id) > -1; }
  function savePost(col, it) {
    if (cloud.on) {
      if (!cloud.uid) { toast('Still connecting. Wait a moment and try again.'); return false; }
      cloud.db.collection(col).doc(it.id).set(Object.assign({ ownerId: cloud.uid }, it))
        .catch(function () { toast('Could not save your post. Check your connection and try again.'); });
      return true;
    }
    state[col].unshift(it); state.mine.push(it.id); save();
    return true;
  }
  function markSold(id) {
    if (cloud.on) {
      cloud.db.collection('farms').doc(id).update({ sold: true }).then(function () { toast('Marked as sold'); }, function () { toast('Could not update. Check your connection.'); });
      return;
    }
    var f = state.farms.filter(function (x) { return x.id === id; })[0];
    if (f) { f.sold = true; save(); render(false); toast('Marked as sold'); }
  }
  function removePost(id) {
    if (cloud.on) {
      var col = state.farms.some(function (x) { return x.id === id; }) ? 'farms' : 'orders';
      cloud.db.collection(col).doc(id).delete().then(function () { toast('Post removed'); }, function () { toast('Could not remove. Check your connection.'); });
      return;
    }
    state.farms = state.farms.filter(function (x) { return x.id !== id; });
    state.orders = state.orders.filter(function (x) { return x.id !== id; });
    state.mine = state.mine.filter(function (m) { return m !== id; });
    save(); render(false); toast('Post removed');
  }
  function startCloud() {
    if (!FIREBASE_CONFIG || !window.firebase) return;
    try {
      firebase.initializeApp(FIREBASE_CONFIG);
      cloud.db = firebase.firestore();
      cloud.on = true;
      state.farms = []; state.orders = [];
      firebase.auth().onAuthStateChanged(function (u) { if (u) { cloud.uid = u.uid; render(false); } });
      firebase.auth().signInAnonymously().catch(function () { toast('Could not connect to the shared database.'); });
      ['farms', 'orders'].forEach(function (col) {
        cloud.db.collection(col).orderBy('ts', 'desc').limit(500).onSnapshot(function (snap) {
          state[col] = snap.docs.map(function (d) { var x = d.data(); x.id = d.id; return x; });
          cloud.loaded = true; render(false);
        }, function () { toast('Could not load posts. Check your internet connection.'); });
      });
    } catch (e) { cloud.on = false; }
  }

  /* ---------- events ---------- */
  function syncFilters() {
    $('#q').value = ui.q; $('#fprod').value = ui.product; $('#fdist').value = ui.district; $('#fdel').checked = ui.delivers;
    $('#frad').value = String(ui.radius); $('#fsort').value = ui.sort;
  }
  $('#toolbar').addEventListener('input', function (e) {
    ui.q = $('#q').value; ui.product = $('#fprod').value; ui.district = $('#fdist').value; ui.delivers = $('#fdel').checked;
    ui.sort = $('#fsort').value; ui.radius = Number($('#frad').value);
    render(e.target.id !== 'q');
  });
  document.addEventListener('change', function (e) {
    var id = e.target.id || '';
    if (/^[bs]-product$/.test(id)) $('#' + id.charAt(0) + '-unit').value = unitFor(e.target.value);
    if (/^[bs]-paste$/.test(id)) {
      var g = checkGps(e.target.value), er = $('#' + id.charAt(0) + '-err');
      if (g === false) er.textContent = GPS_ERR;
      else if (g) { er.textContent = ''; setPin(g); if (map) map.setView([g.lat, g.lng], 12); }
    }
  });
  document.addEventListener('submit', function (e) {
    var form = e.target.closest && e.target.closest('form.postform');
    if (!form) return;
    e.preventDefault();
    submitPost(form.dataset.kind);
  });
  function goTab(t) { endPick(); setPin(null); ui.tab = t; render(true); window.scrollTo(0, 0); }
  document.querySelector('nav.tabs').addEventListener('click', function (e) {
    var b = e.target.closest('[data-tab]'); if (!b) return;
    goTab(b.dataset.tab);
  });

  function find(id) { return state.farms.concat(state.orders).filter(function (x) { return x.id === id; })[0]; }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    var act = b.dataset.act, id = b.dataset.id;
    if (act === 'goto') goTab(b.dataset.tab);
    else if (act === 'locate') useMyLocation();
    else if (act === 'fit-uganda') { if (map) map.fitBounds(UG); }
    else if (act === 'pin-here') locate(function (me) { setPin({ lat: round5(me.lat), lng: round5(me.lng) }); if (map) map.setView([me.lat, me.lng], 14); toast('Pin set to your current location'); });
    else if (act === 'pin-pick') pickOnMap();
    else if (act === 'pin-clear') setPin(null);
    else if (act === 'pick-cancel') endPick();
    else if (act === 'focus') {
      var it = find(id);
      if (it && map) { map.setView([it.lat, it.lng], 13); if (markers[id]) markers[id].openPopup(); $('#map').scrollIntoView({ block: 'nearest' }); }
    } else if (act === 'reveal') {
      var item = find(id); if (!item) return;
      var plain = item.phone.replace(/[^\d+]/g, '');
      var div = document.createElement('div');
      div.className = 'contact';
      div.innerHTML = '<span class="num"></span><div class="row"><button class="btn sm" type="button" data-act="copy">Copy number</button><a class="btn sm ghost" href="tel:' + esc(plain) + '">Call</a></div>';
      div.querySelector('.num').textContent = item.phone;
      div.querySelector('[data-act="copy"]').dataset.num = item.phone;
      var row = b.closest('.row');
      row.parentNode.insertBefore(div, row);
      b.remove();
    } else if (act === 'copy') {
      try { navigator.clipboard.writeText(b.dataset.num).then(function () { toast('Number copied'); }, function () { toast('Press and hold the number to copy it'); }); }
      catch (err) { toast('Press and hold the number to copy it'); }
    } else if (act === 'sold') {
      markSold(id);
    } else if (act === 'remove') {
      removePost(id);
    }
  });

  /* ---------- start ---------- */
  $('#fprod').innerHTML = '<option value="">All products</option>' + opts(PRODUCTS.map(function (p) { return p.name; }));
  $('#fdist').innerHTML = '<option value="">All districts</option>' + opts(DISTRICTS);
  /* ---------- install button (Add to Home screen) ---------- */
  var deferredInstall = null, installBtn = $('#installbtn');
  function isStandalone() { return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true; }
  var isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
  if (isStandalone()) installBtn.hidden = true;
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferredInstall = e; });
  window.addEventListener('appinstalled', function () { deferredInstall = null; installBtn.hidden = true; toast('Poultry Connect is installed'); });
  installBtn.addEventListener('click', function () {
    if (deferredInstall) {
      deferredInstall.prompt();
      deferredInstall.userChoice.then(function () { deferredInstall = null; });
    } else if (isIos) {
      toast('Tap the Share button, then Add to Home Screen.');
    } else {
      toast('Open your browser menu and tap Install app or Add to Home screen.');
    }
  });
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }

  startCloud();
  initMap();
  render(true);
})();
</script>
</body>
</html>
